name: NegativeViewer
options:
  bundleIdPrefix: com.tokugai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  NegativeViewer:
    type: application
    platform: iOS
    sources:
      - path: NegativeViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokugai.negativeviewer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_NSCameraUsageDescription: "Negative Viewer uses the camera to preview film negatives as positives in real time. All processing happens on this device."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
